    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318192d'/%3E%3Cpath d='M15 45V19h8l18 17V19h8v26h-8L23 28v17z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("bi-appearance") || "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            pref === "light" || pref === "dark" ? pref : dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
